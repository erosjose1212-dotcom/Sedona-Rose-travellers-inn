; PHP 8.3 CLI config for HMS Sedona rebuild (Laravel 11)
extension_dir = "ext"
extension=mbstring
extension=openssl
extension=fileinfo
extension=pdo_mysql
extension=mysqli
extension=pdo_sqlite
extension=sqlite3
extension=curl
extension=zip
extension=gd
memory_limit=512M
max_execution_time=300
date.timezone=Asia/Manila
display_errors=On
log_errors=On
